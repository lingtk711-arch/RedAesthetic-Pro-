<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6556" />
      <stop offset="50%" stop-color="#8EA89D" />
      <stop offset="100%" stop-color="#E8C5C8" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0.1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E3227" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Elegant Halo -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="165" fill="url(#circleGrad)" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2.5" />

  <!-- Center Decorative Diamond & Stars -->
  <g filter="url(#shadow)">
    <!-- Central 4-point Aesthetic Star -->
    <path d="M256 120 C256 185 205 236 140 236 C205 236 256 287 256 352 C256 287 307 236 372 236 C307 236 256 185 256 120 Z" fill="#FAF8F5" />
    <!-- Secondary Sparkle -->
    <path d="M350 150 C350 172 334 188 312 188 C334 188 350 204 350 226 C350 204 366 188 388 188 C366 188 350 172 350 150 Z" fill="#FDF3F4" />
    <path d="M162 310 C162 326 150 338 134 338 C150 338 162 350 162 366 C162 350 174 338 190 338 C174 338 162 326 162 310 Z" fill="#FDF3F4" opacity="0.85" />
  </g>

  <!-- Typography: RED Aesthetic -->
  <text x="256" y="416" text-anchor="middle" font-family="'Cinzel', 'Noto Serif SC', serif" font-weight="700" font-size="34" letter-spacing="8" fill="#FFFFFF">RED · 美商</text>
  <text x="256" y="446" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" letter-spacing="4" fill="#F3DDE0" opacity="0.9">AESTHETIC PRO</text>
</svg>
