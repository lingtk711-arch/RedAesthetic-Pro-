    <script>
      // Gracefully handle Vite HMR WebSocket in cloud container sandbox
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('@vite') || url.includes('token=')))) {
              var target = new EventTarget();
              var mockWs = {
                readyState: 1, // OPEN
                addEventListener: target.addEventListener.bind(target),
                removeEventListener: target.removeEventListener.bind(target),
                dispatchEvent: target.dispatchEvent.bind(target),
                send: function() {},
                close: function() {},
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
              // simulate successful open
              setTimeout(function() {
                var openEvt = new Event('open');
                mockWs.dispatchEvent(openEvt);
                if (typeof mockWs.onopen === 'function') mockWs.onopen(openEvt);
              }, 0);
              return mockWs;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
        }

        window.addEventListener('error', function(e) {
          if (e && (
            (e.message && (e.message.includes('WebSocket') || e.message.includes('[vite]'))) ||
            (e.filename && e.filename.includes('@vite/client'))
          )) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
